name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,mcp]"
          pip install ruff mypy
      - name: Tests
        run: python -m pytest
      - name: Lint
        run: ruff check src tests benchmarks
      - name: Typecheck
        run: python -m mypy src tests benchmarks
      - name: Compile check
        run: python -m compileall -q src tests benchmarks
      - name: Offline benchmark (diagnostic, no quality threshold)
        run: |
          python -m benchmarks.evaluate --summary-only
          python -m benchmarks.evaluate --dataset benchmarks/data/quality_holdout.json --summary-only
